version: "3.8"

services:
  # خدمة الداتابيز
  db:
    image: postgres:15-alpine
    container_name: pg_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=sharawy123
      - POSTGRES_DB=pharmacy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # عشان بيانات الداتابيز متتمسحش أبداً
    restart: always

  # خدمة الـ API
  pharmacy-api:
    build: .
    container_name: pharmacy-app
    ports:
      - "8001:8000" # الباب الخارجي 8001 والداخلي 8000
    env_file:
      - .env.production
    depends_on:
      - db # بيقول للدكر: "متقومش الـ API إلا لما الداتابيز تقوم"
    restart: always
    volumes:
      - ./static:/app/static
      - ./app/.env.production:/app/.env.production # عشان يقرأ الإعدادات صح

volumes:
  pgdata: # تعريف مساحة تخزين الداتابيز
