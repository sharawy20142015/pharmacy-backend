version: "3.8"

services:
  # 1️⃣ خدمة قاعدة البيانات (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: pg_db
    env_file:
      - .env.production # خليه يقرأ اليوزر والباسورد واسم الداتا بيز من هنا مباشرة
    environment:
      # السطر ده هو "السحر" اللي بيكريت الداتا بيز أوتوماتيك أول ما الدوكر يقوم
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2️⃣ خدمة الباك إند (FastAPI)
  pharmacy-api:
    build: .
    container_name: pharmacy-app
    ports:
      - "8001:8000"
    env_file:
      - .env.production
    depends_on:
      - db
    restart: always
    volumes:
      - ./static:/app/static
      # ملاحظة: لو الملفات موجودة في نفس المجلد، السطر ده كفاية
      - ./.env.production:/app/.env.production

volumes:
  pgdata:
